name: CI

on:
  push:
    branches: [main, preparacao-lancamento]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: tsc, build e Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          # Valores fictícios: o build só precisa das variáveis definidas.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
          VITE_VAPID_PUBLIC_KEY: ci-placeholder
      - name: Sem segredos de servidor no bundle
        run: |
          if grep -rEl "service_role|SUPABASE_SERVICE_ROLE|VAPID_PRIVATE|sb_secret_|BILLING_WEBHOOK_TOKEN|PUSH_WEBHOOK_SECRET|-----BEGIN [A-Z ]*PRIVATE KEY" dist; then
            echo "Possível segredo no bundle (dist/)"; exit 1
          fi
      - name: Testes
        run: npm test

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Varredura do histórico
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .
